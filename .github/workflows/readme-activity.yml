name: Update README Activity

# The weekly run happens locally via launchd (scripts/install-schedule.sh) so it can
# use the Claude Code subscription instead of a metered API key. This workflow is the
# manual fallback for when that machine is away; it needs ANTHROPIC_API_KEY to write
# the narrative paragraph, and produces the plain list without it.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet anthropic

      - name: Regenerate activity block
        env:
          # GH_PAT (repo read scope) surfaces private work; without it the built-in
          # token still works but only sees public activity.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
          # Optional. Unset -> the block is written without the narrative paragraph.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_readme.py

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "No change this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh README activity"
          git push
